<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <title>Messenger App (Week 9)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Messenger (Week 9)</h1>
    <div class="d-flex flex-column min-vh-100" id="chat-app">
        
        <div class="m-4">
            <div class="row">
                <div class="col-6">
                    <h2>Register</h2>
                    <form id="registerForm" method="POST">
                        <div>
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name">
                        </div>
                        <div>
                            <label for="email">Email:</label>
                            <input type="text" id="email" name="email">
                        </div>
                        <div>
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password">
                        </div>
                        <div>
                            <label for="group_id">Group ID:</label>
                            <input type="text" id="group_id" name="group_id">
                        </div>
                        <button type="submit" class="btn btn-success">Register</button>
                    </form>
                    <!-- Registration successful! New user ID: -->
                    <div id="registerMessage"></div>
                </div>
                
                <div class="col-6">
                    <h2>Login</h2>
                    <form id="loginForm" method="POST">
                        <div>
                            <label for="email">Email:</label>
                            <input type="text" id="email" name="email">
                        </div>
                        <div>
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password">
                        </div>
                        <button type="submit" class="btn btn-success">Login</button>
                    </form>
                    <!-- Login successful! Token: -->
                    <div id="loginMessage"></div>
                </div>
            </div>
        </div>


        <div class="m-4">
            <div class="row">
                <aside class="col-12 col-md-5 col-lg-4 col-xxl-3">
                    <div class="user-list">
                        <h2>All Users</h2>
                        <!-- list of all users -->
                        <div id="userList"></div>
                    </div>
                </aside>

                <main class="col-12 col-md-7 col-lg-8 col-xxl-9 flex-grow-1">
                    <div class="chat-window">
                        <h2>Chat</h2>
                        <!-- name of selected chat-partner -->
                        <div id="chat-partner"></div>

                        <!-- chat messages -->
                        <div id="chat-messages"></div>

                        <form id="messageForm" method="POST">
                            <input type="text" id="message" name="message" placeholder="Write something...">
                            <button type="submit" class="btn btn-primary">Send</button>
                        </form>
                        <!-- potential message errors -->
                        <div id="messageInfo"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script type="module" src="../dist/main.js"></script>
</body>
</html>
